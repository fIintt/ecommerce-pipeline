[project]
name = "ecommerce-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "flint", email = "kiddolol39@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
ecommerce-pipeline = "ecommerce_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
